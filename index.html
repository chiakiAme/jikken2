<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic Park // 簿記アドベンチャー</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --red: #e21b2d;
      --yellow: #ffd43b;
      --yellow-dark: #e5a900;
      --black: #171717;
      --white: #ffffff;
      --pink: #f7a6b8;
      --purple: #7c3aed;
      --text: #2b2118;
      --muted: #806f60;
      --border: #ead8b4;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: var(--text);
      background-color: #fff8df;
      padding: 16px;
      overflow-x: hidden;
    }
    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      background: #ffffff;
      border: 4px solid var(--red);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 8px 0 var(--black);
      position: relative;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 3px solid var(--black);
      margin-bottom: 14px;
    }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    .mouse-logo-svg { width: 50px; height: 46px; flex-shrink: 0; }
    .logo-title { margin: 0; font-size: 1.1rem; color: var(--red); font-weight: 900; }
    .status-badge {
      background: var(--red);
      color: white;
      padding: 6px 12px;
      border-radius: 999px;
      border: 2px solid var(--black);
      font-size: 0.72rem;
      font-weight: 900;
    }
    .status-badge.review {
      background: var(--yellow);
      color: var(--black);
    }
    .stage-tabs {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      margin-bottom: 14px;
    }
    @media (max-width: 580px) {
      .stage-tabs {
        grid-template-columns: repeat(3, 1fr);
      }
    }
    .stage-btn {
      padding: 8px 2px;
      border: 2px solid var(--black);
      border-radius: 10px;
      background: #fffdf4;
      font-size: 0.7rem;
      font-weight: 900;
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 3px 0 var(--black);
      transition: all 0.1s ease;
      text-align: center;
      line-height: 1.25;
    }
    .stage-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--black);
    }
    .stage-btn.active {
      background: var(--red);
      color: white;
      box-shadow: 0 2px 0 var(--black);
      transform: translateY(1px);
    }
    .stage-btn.ex-tab.active {
      background: var(--purple);
    }
    .park-progress {
      margin-bottom: 16px;
      padding: 10px 14px;
      background: #fff7d6;
      border: 2px solid var(--yellow-dark);
      border-radius: 14px;
    }
    .progress-track {
      height: 12px;
      width: 100%;
      background: #f7e6a9;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 6px;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: var(--red);
      transition: width 0.3s ease;
    }
    .card {
      background: #ffffff;
      border: 2px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }
    .question-label {
      display: inline-block;
      background: var(--red);
      color: white;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 900;
      margin-bottom: 8px;
    }
    .story-text { margin: 0; font-size: 0.95rem; line-height: 1.6; }
    .split-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }
    @media(max-width: 560px) { .split-container { grid-template-columns: 1fr; } }
    .side-column {
      padding: 12px;
      background: #fffdf4;
      border: 2px solid var(--yellow);
      border-radius: 14px;
    }
    .side-column.credit { background: #fff4f5; border-color: var(--pink); }
    .side-title { text-align: center; margin-bottom: 8px; font-weight: 900; font-size: 0.85rem; }
    .entry-row { display: flex; gap: 6px; margin-bottom: 8px; }
    .entry-row input {
      padding: 8px;
      border: 2px solid #e7d7b6;
      border-radius: 8px;
      font-size: 0.9rem;
      width: 100%;
    }
    .entry-row input[type="text"] { flex: 1.3; }
    .entry-row input[type="number"] { flex: 1; }
    .btn-remove {
      background: #ffe4e6;
      border: 1px solid #fda4af;
      border-radius: 6px;
      color: var(--red);
      cursor: pointer;
      font-weight: bold;
    }
    .btn-add {
      width: 100%;
      padding: 6px;
      background: white;
      border: 1px dashed var(--yellow-dark);
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: bold;
    }
    .credit .btn-add {
      border-color: var(--pink);
      color: #9f1239;
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--red);
      color: white;
      border: 3px solid var(--black);
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--black);
      touch-action: manipulation;
    }
    .result-box {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .result-box.correct { background: #dcfce7; border: 2px solid #86efac; color: #166534; }
    .result-box.wrong { background: #fee2e2; border: 2px solid #fda4af; color: #991b1b; }
    .nav-buttons { display: flex; gap: 10px; margin-top: 14px; }
    .nav-btn {
      flex: 1;
      padding: 10px;
      background: var(--black);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .clear-card { display: none; text-align: center; padding: 24px 16px; }
    .badge-complete {
      display: inline-block;
      padding: 8px 16px;
      background: #fef08a;
      border: 2px solid var(--black);
      border-radius: 999px;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .btn-review, .btn-restart {
      width: 100%;
      padding: 12px;
      border: 2px solid var(--black);
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-review { background: var(--yellow); color: var(--black); }
    .btn-restart { background: #475569; color: white; }
    details {
      margin-top: 20px;
      border-top: 2px dashed #d9bd83;
      padding-top: 14px;
    }
    summary {
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: bold;
    }
    textarea {
      width: 100%;
      height: 100px;
      margin-top: 10px;
      padding: 10px;
      border: 2px solid #dfc99c;
      border-radius: 10px;
      font-size: 0.8rem;
      font-family: monospace;
      resize: vertical;
      outline: none;
    }
    .load-btn {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      background: var(--yellow);
      color: var(--black);
      border: 2px solid var(--black);
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--black);
    }
    .reset-link {
      display: block;
      margin-top: 18px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      cursor: pointer;
      text-decoration: underline;
    }
    .shake-animation {
      animation: shake 0.45s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes shake {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-7px, 0, 0); }
      40%, 60% { transform: translate3d(7px, 0, 0); }
    }
    .rising-item {
      position: fixed;
      bottom: -30px;
      z-index: 9999;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      animation: riseUp ease-out forwards;
    }
    @keyframes riseUp {
      0% {
        transform: translateY(0) translateX(0) scale(0.4) rotate(0deg);
        opacity: 0;
      }
      15% { opacity: 0.95; }
      50% {
        transform: translateY(-50vh) translateX(var(--drift, 20px)) scale(1.1) rotate(180deg);
        opacity: 0.9;
      }
      85% { opacity: 0.7; }
      100% {
        transform: translateY(-110vh) translateX(calc(var(--drift, 20px) * -1)) scale(1.3) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

<div class="container" id="mainContainer">
  <div class="header">
    <div class="logo-area">
      <svg class="mouse-logo-svg" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
        <circle cx="24" cy="26" r="18" fill="#171717" />
        <circle cx="76" cy="26" r="18" fill="#171717" />
        <circle cx="50" cy="55" r="30" fill="#171717" />
        <circle cx="50" cy="55" r="8" fill="#ffd43b" />
      </svg>
      <div>
        <h1 class="logo-title">マジックパーク簿記</h1>
        <div style="font-size:0.7rem; color:var(--muted);" id="sub-title">〜 魔法の仕訳アドベンチャー 〜</div>
      </div>
    </div>
    <span class="status-badge" id="status-tag">🎡 探索中</span>
  </div>

  <div class="stage-tabs">
    <button type="button" class="stage-btn active" id="tab-0" onclick="switchStage(0)">Lv.1<br>新アトラク</button>
    <button type="button" class="stage-btn" id="tab-1" onclick="switchStage(1)">Lv.2<br>トイ・ストーリー</button>
    <button type="button" class="stage-btn" id="tab-2" onclick="switchStage(2)">Lv.3<br>タワテラ</button>
    <button type="button" class="stage-btn" id="tab-3" onclick="switchStage(3)">Lv.4<br>ホテル限定</button>
    <button type="button" class="stage-btn" id="tab-4" onclick="switchStage(4)">Lv.5<br>きよのさん</button>
    <button type="button" class="stage-btn ex-tab" id="tab-5" onclick="switchStage(5)">Lv.EX<br>T勘定の迷宮</button>
  </div>

  <div class="park-progress">
    <div style="display:flex; justify-content:space-between; font-size:0.75rem; font-weight:bold;">
      <span id="stage-badge-text">🎟️ Lv.1 新アトラクションチャレンジ編</span>
      <span id="progress-text">第 1 問</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <div id="quiz-area">
    <div class="card">
      <div class="question-label" id="q-number">アトラクション // 01</div>
      <p class="story-text" id="story-display">読み込み中...</p>
    </div>

    <div class="split-container">
      <div class="side-column">
        <div class="side-title">🖤 借方 (Debit)</div>
        <div id="debit-rows"></div>
        <button type="button" class="btn-add" onclick="addRow('debit')">＋ 行を追加</button>
      </div>
      <div class="side-column credit">
        <div class="side-title">❤️ 貸方 (Credit)</div>
        <div id="credit-rows"></div>
        <button type="button" class="btn-add" onclick="addRow('credit')">＋ 行を追加</button>
      </div>
    </div>

    <button type="button" class="btn-submit" id="submit-btn" onclick="checkAnswer()">✨ 魔法の仕訳を判定する！</button>
    <div id="result-display" class="result-box"></div>

    <div class="nav-buttons">
      <button type="button" class="nav-btn" onclick="prevQuestion()">◀ 前へ</button>
      <button type="button" class="nav-btn" id="next-btn" onclick="nextQuestion()">次へ ▶</button>
    </div>
  </div>

  <div id="clear-area" class="clear-card">
    <h2>🏰 ステージ完全攻略！</h2>
    <div id="complete-badge-area"></div>
    <p id="score-text" style="line-height:1.6; color:var(--muted);"></p>
    <div id="review-btn-area"></div>
    <button type="button" class="btn-restart" onclick="startFreshStage()">このステージを最初からもう一度 🎠</button>
  </div>

  <details>
    <summary>🎟️ 外部の追加問題データを読み込む (JSON)</summary>
    <textarea id="json-input" placeholder="AIが作成した問題データ（[ ... ]）をここに貼り付けると、現在選択中のステージを丸ごと上書きできます"></textarea>
    <button type="button" class="load-btn" onclick="loadCustomData()">🗝️ 問題データを反映</button>
  </details>

  <span class="reset-link" onclick="forceReset()">※ 画面がおかしいときはここを押して全データを初期化</span>
</div>
<script>
const STAGES = [
  {
    title: "Lv.1 新アトラクションチャレンジ編",
    questions: [
      {
        "story": "【アトラクション準備】新規アトラクションの装飾資材 300,000円を発注し、内金（手付金）として 50,000円を当座預金口座から小切手を振り出して支払った。（前払金）（当座預金）",
        "debit": [{ "account": "前払金", "amount": 50000 }],
        "credit": [{ "account": "当座預金", "amount": 50000 }],
        "explanation": "商品の引渡し前に支払った内金は資産（Asset）である前払金（Advance Payments）として借方に計上し、小切手振出に伴う当座預金（Checking Account）の減少を貸方に記入します。"
      },
      {
        "story": "【機材導入】新アトラクション用ライド機材（備品）本体 500,000円が納入され、設置据付費用（付随費用）30,000円とともに、先に支払っていた内金 50,000円を差し引いた残額 480,000円を小切手を振り出して支払った。（備品）（前払金）（当座預金）",
        "debit": [{ "account": "備品", "amount": 530000 }],
        "credit": [{ "account": "前払金", "amount": 50000 }, { "account": "当座預金", "amount": 480000 }],
        "explanation": "固定資産の購入にかかる付随費用は取得原価（Acquisition Cost）に含めるため、備品（Equipment）530,000円を借方に計上し、充当した前払金（Advance Payments）50,000円と当座預金の減少 480,000円を貸方に記入する複合仕訳です。"
      },
      {
        "story": "【試運転と故障】開園前の試運転中にライドの安全制御センサーが一部故障したため、緊急修理を依頼し、修繕費用（修繕費）25,000円を現金で支払った。（修繕費）（現金）",
        "debit": [{ "account": "修繕費", "amount": 25000 }],
        "credit": [{ "account": "現金", "amount": 25000 }],
        "explanation": "設備の維持管理・原状回復にかかる費用（Expense）である修繕費（Repair Expense）を借方に記入し、資産（Asset）である現金（Cash）の減少を貸方に記入します。"
      },
      {
        "story": "【試運転成功・保険加入】再試運転が無事に成功し安全性が確認されたため、今後の運行事故に備えて1年分の損害保険料（支払保険料）36,000円を普通預金口座から支払った。（支払保険料）（普通預金）",
        "debit": [{ "account": "支払保険料", "amount": 36000 }],
        "credit": [{ "account": "普通預金", "amount": 36000 }],
        "explanation": "役務提供やリスクヘッジにかかる費用（Expense）である支払保険料（Insurance Expense）を借方に記入し、資産（Asset）である普通預金（Ordinary Deposit）の減少を貸方に記入します。"
      },
      {
        "story": "【宣伝パレード】新アトラクションのオープンをパーク内外へ告知する宣伝パレードのポスター印刷代および広告宣伝費 70,000円を掛け（後日払い）で発注した。（広告宣伝費）（未払金）",
        "debit": [{ "account": "広告宣伝費", "amount": 70000 }],
        "credit": [{ "account": "未払金", "amount": 70000 }],
        "explanation": "プロモーションに伴う費用（Expense）である広告宣伝費（Advertising Expense）を借方に記入し、商品売買以外の営業外債務である負債（Liability）の未払金（Accounts Payable - other）を貸方に記入します。"
      },
      {
        "story": "【ショップ仕入】アトラクション併設の記念ショップで販売する限定マスコット人形（仕入）120,000円分をドナルド商会から掛けで仕入れた。（仕入）（買掛金）",
        "debit": [{ "account": "仕入", "amount": 120000 }],
        "credit": [{ "account": "買掛金", "amount": 120000 }],
        "explanation": "営業取引に伴う費用（Expense）である仕入（Purchases）を借方に記入し、後日支払義務である負債（Liability）の買掛金（Accounts Payable）を貸方に記入します。"
      },
      {
        "story": "【ショップ運営・売上】記念ショップにて限定マスコットをゲストへ販売し、売上 180,000円のうち 80,000円は現金で受け取り、残額 100,000円はクレジットカード掛け（売掛金）とした。（現金）（売掛金）（売上）",
        "debit": [{ "account": "現金", "amount": 80000 }, { "account": "売掛金", "amount": 100000 }],
        "credit": [{ "account": "売上", "amount": 180000 }],
        "explanation": "収益（Revenue）である売上（Sales）180,000円を貸方に記入し、受け取った資産（Asset）の現金（Cash）80,000円と売掛金（Accounts Receivable）100,000円を借方に記入する複合仕訳です。"
      },
      {
        "story": "【お楽しみイベント】午後、アトラクション前広場にて特別グリーティングイベントを開催し、参加者からの特別体験手数料（受取手数料）として現金 40,000円を受け取った。（現金）（受取手数料）",
        "debit": [{ "account": "現金", "amount": 40000 }],
        "credit": [{ "account": "受取手数料", "amount": 40000 }],
        "explanation": "役務提供の対価として収益（Revenue）である受取手数料（Commission Received）が発生するため貸方に記入し、資産（Asset）である現金（Cash）の増加を借方に記入します。"
      },
      {
        "story": "【日次点検】夜の特別営業に備えてライド設備およびパレード機材の点検を実施し、メンテナンス用潤滑油や清掃クロス（消耗品費）6,000円を現金で購入した。（消耗品費）（現金）",
        "debit": [{ "account": "消耗品費", "amount": 6000 }],
        "credit": [{ "account": "現金", "amount": 6000 }],
        "explanation": "消耗資材の消費に伴う費用（Expense）である消耗品費（Supplies Expense）を借方に記入し、資産（Asset）である現金（Cash）の減少を貸方に記入します。"
      },
      {
        "story": "【夜の特別イベントと金庫預入】夜の特別イルミネーションイベントが無事終了し閉園した。レジ内の売上現金 200,000円を安全のため夜間金庫を通じて普通預金口座へ預け入れた。（普通預金）（現金）",
        "debit": [{ "account": "普通預金", "amount": 200000 }],
        "credit": [{ "account": "現金", "amount": 200000 }],
        "explanation": "資産（Asset）である普通預金（Ordinary Deposit）の増加を借方に記入し、同じく資産である現金（Cash）の減少を貸方に記入します。"
      }
    ]
  },
  {
    title: "Lv.2 トイ・ストーリーエリア編",
    questions: [
      {
        "story": "【エリア開業準備】新しくオープンするトイ・ストーリーエリアの建設に先立ち、工事代金の一部として手付金 200,000円を普通預金口座から振り込んで支払った。（前払金）（普通預金）",
        "debit": [{ "account": "前払金", "amount": 200000 }],
        "credit": [{ "account": "普通預金", "amount": 200000 }],
        "explanation": "役務や商品の受取前に支払った手付金は資産（Asset）である「前払金（Advance Payments）」の借方に計上し、資産である「普通預金（Ordinary Deposit）」の減少を貸方に記入します。"
      },
      {
        "story": "【アトラクション機材納入】アンディの部屋を模した大型シューティングライド機材 800,000円が納入され、据付設置費用（付随費用）50,000円を加えた合計額のうち、支払済みの手付金 200,000円を充当し、残額 650,000円は小切手を振り出して支払った。（備品）（前払金）（当座預金）",

let currentStageIndex = 0;
let currentQuestions = [];
let currentIndex = 0;
let correctCount = 0;
let wrongList = [];
let answeredSet = new Set();
let isReviewMode = false;

function init() {
  const savedStage = localStorage.getItem("magic_park_current_stage");
  currentStageIndex = savedStage ? parseInt(savedStage, 10) : 0;
  if (currentStageIndex < 0 || currentStageIndex >= STAGES.length) currentStageIndex = 0;

  loadStage(currentStageIndex);
}

function switchStage(stageIdx) {
  if (stageIdx === currentStageIndex && !isReviewMode) return;
  loadStage(stageIdx);
}

function loadStage(stageIdx) {
  currentStageIndex = stageIdx;
  localStorage.setItem("magic_park_current_stage", currentStageIndex);

  for (let i = 0; i < STAGES.length; i++) {
    const btn = document.getElementById(`tab-${i}`);
    if (btn) {
      if (i === stageIdx) btn.classList.add("active");
      else btn.classList.remove("active");
    }
  }

  const stageObj = STAGES[stageIdx];
  document.getElementById("stage-badge-text").textContent = `🎟️ ${stageObj.title}`;
  document.getElementById("sub-title").textContent = `〜 ${stageObj.title} 〜`;

  const keyPrefix = `magic_park_st${stageIdx}_`;
  let stageData = stageObj.questions;
  try {
    const customData = localStorage.getItem(`${keyPrefix}data`);
    if (customData) {
      const parsed = JSON.parse(customData);
      if (Array.isArray(parsed) && parsed.length > 0) stageData = parsed;
    }
  } catch(e) {}

  currentQuestions = [...stageData];
  currentIndex = 0;
  correctCount = 0;
  wrongList = [];
  isReviewMode = false;
  answeredSet.clear();

  document.getElementById("quiz-area").style.display = "block";
  document.getElementById("clear-area").style.display = "none";
  loadQuestion(0);
}

function createRowHTML(account = "", amount = "") {
  const div = document.createElement("div");
  div.className = "entry-row";
  div.innerHTML = `
    <input type="text" placeholder="科目" value="${account}">
    <input type="number" placeholder="金額" value="${amount}">
    <button type="button" class="btn-remove" onclick="removeRow(this)">✕</button>
  `;
  return div;
}

function addRow(side) {
  const container = document.getElementById(`${side}-rows`);
  if (container) container.appendChild(createRowHTML());
}

function removeRow(btn) {
  const row = btn.closest(".entry-row");
  if (row && row.parentElement && row.parentElement.children.length > 1) {
    row.remove();
  } else {
    alert("最低1行は必要です。");
  }
}

function loadQuestion(index) {
  if (!currentQuestions || currentQuestions.length === 0) return;
  if (index < 0 || index >= currentQuestions.length) index = 0;
  currentIndex = index;

  const tag = document.getElementById("status-tag");
  if (isReviewMode) {
    tag.textContent = "🔄 復習中";
    tag.className = "status-badge review";
  } else {
    tag.textContent = "🎡 探索中";
    tag.className = "status-badge";
  }

  const stageLabel = (currentStageIndex === 5) ? "Lv.EX" : `Lv.${currentStageIndex + 1}`;
  const prefix = isReviewMode ? "🔄 復習" : stageLabel;
  document.getElementById("q-number").textContent = `${prefix} // ${index + 1} / ${currentQuestions.length}`;
  document.getElementById("story-display").textContent = currentQuestions[index].story;

  document.getElementById("debit-rows").innerHTML = "";
  document.getElementById("credit-rows").innerHTML = "";
  addRow("debit");
  addRow("credit");

  const res = document.getElementById("result-display");
  res.style.display = "none";
  res.className = "result-box";
  document.getElementById("submit-btn").style.display = "block";

  const nextBtn = document.getElementById("next-btn");
  nextBtn.textContent = (currentIndex === currentQuestions.length - 1) ? "結果を見る ✨" : "次へ ▶";

  const percent = Math.round(((index + 1) / currentQuestions.length) * 100);
  document.getElementById("progress-fill").style.width = percent + "%";
  document.getElementById("progress-text").textContent = `${index + 1} / ${currentQuestions.length} 問 (${percent}%)`;
}

function getEntries(side) {
  const container = document.getElementById(`${side}-rows`);
  if (!container) return [];
  const rows = container.children;
  const entries = [];
  for (let row of rows) {
    const inputs = row.querySelectorAll("input");
    if (inputs.length >= 2) {
      const account = inputs[0].value.trim();
      const amount = parseInt(inputs[1].value, 10);
      if (account && !isNaN(amount)) entries.push({ account, amount });
    }
  }
  return entries;
}

function spawnRisingMagic() {
  const symbols = ["✨", "⭐", "🎈", "🎀", "💖", "💛", "🪙", "🏰"];
  const totalItems = 30;

  for (let i = 0; i < totalItems; i++) {
    const item = document.createElement("div");
    item.className = "rising-item";
    item.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    item.style.left = (Math.random() * 92 + 4) + "vw";
    
    const driftX = (Math.random() * 80 - 40) + "px";
    item.style.setProperty("--drift", driftX);

    const size = Math.random() * 18 + 20;
    const duration = Math.random() * 1.6 + 2.0;
    const delay = Math.random() * 0.5;

    item.style.fontSize = size + "px";
    item.style.animationDuration = duration + "s";
    item.style.animationDelay = delay + "s";

    document.body.appendChild(item);

    setTimeout(() => {
      item.remove();
    }, (duration + delay) * 1000);
  }
}

function triggerShake() {
  const container = document.getElementById("mainContainer");
  container.classList.remove("shake-animation");
  void container.offsetWidth;
  container.classList.add("shake-animation");

  setTimeout(() => {
    container.classList.remove("shake-animation");
  }, 500);
}

function checkAnswer() {
  const q = currentQuestions[currentIndex];
  const userDebit = getEntries("debit");
  const userCredit = getEntries("credit");

  const normalize = d => Array.isArray(d) ? d : [d];
  const cDebit = normalize(q.debit);
  const cCredit = normalize(q.credit);

  const matchSide = (u, c) => {
    if (u.length !== c.length) return false;
    const sU = [...u].sort((a,b) => a.account.localeCompare(b.account) || a.amount - b.amount);
    const sC = [...c].sort((a,b) => a.account.localeCompare(b.account) || a.amount - b.amount);
    return sU.every((v, i) => v.account === sC[i].account && v.amount === sC[i].amount);
  };

  const isOk = matchSide(userDebit, cDebit) && matchSide(userCredit, cCredit);
  const res = document.getElementById("result-display");
  res.style.display = "block";

  if (isOk) {
    spawnRisingMagic();
    res.className = "result-box correct";
    res.innerHTML = `<strong>⭐ 大正解！</strong><br>${q.explanation}`;
    if (!answeredSet.has(currentIndex)) {
      correctCount++;
      if (isReviewMode) wrongList = wrongList.filter(item => item.story !== q.story);
      answeredSet.add(currentIndex);
    }
  } else {
    triggerShake();
    res.className = "result-box wrong";
    const dStr = cDebit.map(d => `(${d.account}: ${d.amount.toLocaleString()}円)`).join(" ");
    const cStr = cCredit.map(c => `(${c.account}: ${c.amount.toLocaleString()}円)`).join(" ");
    res.innerHTML = `<strong>🎀 おしい！もう一度確認しよう</strong><br>借方: ${dStr}<br>貸方: ${cStr}<br><br>${q.explanation}`;
    if (!answeredSet.has(currentIndex)) {
      if (!wrongList.some(item => item.story === q.story)) wrongList.push(q);
      answeredSet.add(currentIndex);
    }
  }
}

function prevQuestion() { if (currentIndex > 0) loadQuestion(currentIndex - 1); }
function nextQuestion() {
  if (currentIndex < currentQuestions.length - 1) loadQuestion(currentIndex + 1);
  else showClearScreen();
}

function showClearScreen() {
  document.getElementById("quiz-area").style.display = "none";
  const clearArea = document.getElementById("clear-area");
  clearArea.style.display = "block";

  const total = currentQuestions.length;
  const badgeArea = document.getElementById("complete-badge-area");
  const scoreText = document.getElementById("score-text");
  const revArea = document.getElementById("review-btn-area");

  badgeArea.innerHTML = "";
  revArea.innerHTML = "";

  if (wrongList.length === 0) {
    spawnRisingMagic();
    badgeArea.innerHTML = `<div class="badge-complete">🏆 ステージ完全攻略！</div>`;
    scoreText.innerHTML = `全問正解です！おめでとうございます！ (${total}/${total})`;
  } else {
    scoreText.innerHTML = `${total}問中 ${correctCount}問 正解でした。<br>あと ${wrongList.length}問 復習できます。`;
    const btn = document.createElement("button");
    btn.className = "btn-review";
    btn.textContent = `🔄 間違えた問題だけ復習する (${wrongList.length}問)`;
    btn.onclick = () => {
      isReviewMode = true;
      currentQuestions = [...wrongList];
      currentIndex = 0;
      correctCount = 0;
      answeredSet.clear();
      document.getElementById("quiz-area").style.display = "block";
      clearArea.style.display = "none";
      loadQuestion(0);
    };
    revArea.appendChild(btn);
  }
}

function startFreshStage() {
  loadStage(currentStageIndex);
}

function forceReset() {
  localStorage.clear();
  location.reload();
}

function loadCustomData() {
  const input = document.getElementById("json-input").value.trim();
  if (!input) {
    alert("JSONデータを貼り付けてください。");
    return;
  }
  try {
    const data = JSON.parse(input);
    if (!Array.isArray(data) || data.length === 0) throw new Error();

    STAGES[currentStageIndex].questions = data;
    localStorage.setItem(`magic_park_st${currentStageIndex}_data`, JSON.stringify(data));
    loadStage(currentStageIndex);
    const stageLabel = (currentStageIndex === 5) ? "Lv.EX" : `Lv.${currentStageIndex + 1}`;
    alert(`現在のステージ（${stageLabel}）に新しい問題（全${data.length}問）を登録しました！`);
  } catch (e) {
    alert("⚠️ JSONデータの形式を確認してください。正しく貼り付けられているかチェックをお願いします。");
  }
}

window.addEventListener("DOMContentLoaded", init);
</script>
