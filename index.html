<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T勘定の迷宮 // The Labyrinth of T-Accounts</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg-dark: #0f172a;
      --panel-bg: #1e293b;
      --card-bg: #0f172a;
      --gold: #f59e0b;
      --gold-light: #fbbf24;
      --cyan: #06b6d4;
      --purple: #8b5cf6;
      --crimson: #ef4444;
      --border-stone: #475569;
      --border-rune: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --debit-tint: #1e1b4b;
      --credit-tint: #450a0a;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      color: var(--text-main);
      background: radial-gradient(circle at 50% 10%, #1e1e38 0%, #090d16 100%);
      padding: 16px;
      overflow-x: hidden;
    }
    .container {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      background: var(--panel-bg);
      border: 3px solid var(--gold);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(245, 158, 11, 0.15);
      position: relative;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 2px solid var(--border-stone);
      margin-bottom: 14px;
    }
    .logo-area { display: flex; align-items: center; gap: 14px; }
    .rune-logo-svg { width: 48px; height: 48px; flex-shrink: 0; }
    .logo-title {
      margin: 0;
      font-size: 1.25rem;
      color: var(--gold-light);
      font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(245, 158, 11, 0.5);
    }
    .status-badge {
      background: #312e81;
      color: #c7d2fe;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid #6366f1;
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.5px;
    }
    .status-badge.review {
      background: #78350f;
      color: #fde68a;
      border-color: var(--gold);
    }

    /* ダンジョン踏破ゲージ */
    .dungeon-progress {
      margin-bottom: 16px;
      padding: 12px 14px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border-stone);
      border-radius: 12px;
    }
    .progress-track {
      height: 10px;
      width: 100%;
      background: #020617;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 8px;
      border: 1px solid #334155;
    }
    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--gold), #fbbf24);
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
      transition: width 0.35s ease;
    }

    /* 試練カード */
    .card {
      background: var(--card-bg);
      border: 2px solid var(--border-stone);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    }
    .floor-badge {
      display: inline-block;
      background: linear-gradient(135deg, #4f46e5, #3730a3);
      color: #e0e7ff;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 900;
      border: 1px solid #818cf8;
      margin-bottom: 10px;
    }
    .story-text {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.7;
      color: #e2e8f0;
    }

    /* T勘定の天秤 (借方・貸方) */
    .split-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    @media(max-width: 560px) { .split-container { grid-template-columns: 1fr; } }
    .side-column {
      padding: 12px;
      background: var(--debit-tint);
      border: 2px solid #4338ca;
      border-radius: 12px;
    }
    .side-column.credit {
      background: var(--credit-tint);
      border-color: #991b1b;
    }
    .side-title {
      text-align: center;
      margin-bottom: 10px;
      font-weight: 900;
      font-size: 0.85rem;
      color: #e2e8f0;
      letter-spacing: 0.5px;
    }
    .entry-row { display: flex; gap: 6px; margin-bottom: 8px; }
    .entry-row input {
      padding: 9px;
      background: #090d16;
      border: 1px solid #475569;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #f8fafc;
      width: 100%;
    }
    .entry-row input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 6px rgba(245, 158, 11, 0.4);
    }
    .entry-row input[type="text"] { flex: 1.3; }
    .entry-row input[type="number"] { flex: 1; }
    .btn-remove {
      background: #7f1d1d;
      border: 1px solid #b91c1c;
      border-radius: 6px;
      color: #fecaca;
      cursor: pointer;
      font-weight: bold;
    }
    .btn-add {
      width: 100%;
      padding: 7px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px dashed #6366f1;
      border-radius: 8px;
      color: #c7d2fe;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
    }
    .credit .btn-add {
      border-color: #ef4444;
      color: #fecaca;
    }
    .btn-add:hover { background: rgba(30, 41, 59, 0.9); }

    /* 詠唱・判定ボタン */
    .btn-submit {
      width: 100%;
      padding: 15px;
      background: linear-gradient(180deg, #d97706, #b45309);
      color: #fff;
      border: 2px solid var(--gold-light);
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #78350f, 0 0 15px rgba(245, 158, 11, 0.4);
      touch-action: manipulation;
      letter-spacing: 1px;
    }
    .btn-submit:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #78350f;
    }

    /* 判定結果エリア */
    .result-box {
      display: none;
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.65;
    }
    .result-box.correct {
      background: rgba(6, 78, 59, 0.85);
      border: 2px solid #10b981;
      color: #d1fae5;
    }
    .result-box.wrong {
      background: rgba(127, 29, 29, 0.85);
      border: 2px solid #ef4444;
      color: #fee2e2;
    }
    .nav-buttons { display: flex; gap: 10px; margin-top: 14px; }
    .nav-btn {
      flex: 1;
      padding: 11px;
      background: #334155;
      color: #f8fafc;
      border: 1px solid #64748b;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .nav-btn:hover { background: #475569; }

    /* 迷宮踏破画面 */
    .clear-card { display: none; text-align: center; padding: 26px 16px; }
    .badge-complete {
      display: inline-block;
      padding: 9px 20px;
      background: linear-gradient(135deg, #d97706, #78350f);
      border: 2px solid var(--gold-light);
      border-radius: 999px;
      font-weight: 900;
      color: #fef08a;
      font-size: 1.1rem;
      margin-bottom: 14px;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
    }
    .btn-review, .btn-restart {
      width: 100%;
      padding: 12px;
      border: 2px solid #475569;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 10px;
    }
    .btn-review {
      background: linear-gradient(180deg, #d97706, #92400e);
      color: white;
      border-color: var(--gold);
    }
    .btn-restart { background: #1e293b; color: #cbd5e1; }

    /* 古文書JSON読み込み */
    details {
      margin-top: 22px;
      border-top: 1px dashed var(--border-stone);
      padding-top: 14px;
    }
    summary {
      cursor: pointer;
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: bold;
    }
    textarea {
      width: 100%;
      height: 90px;
      margin-top: 10px;
      padding: 10px;
      background: #090d16;
      border: 1px solid var(--border-stone);
      border-radius: 10px;
      font-size: 0.8rem;
      font-family: monospace;
      color: #f8fafc;
      resize: vertical;
    }
    .load-btn {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      background: #334155;
      color: var(--gold-light);
      border: 1px solid var(--border-stone);
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }
    .reset-link {
      display: block;
      margin-top: 18px;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: underline;
    }

    /* ダンジョン罠（トラップシェイク） */
    .shake-animation {
      animation: trapShake 0.45s cubic-bezier(.36,.07,.19,.97) both;
    }
    @keyframes trapShake {
      10%, 90% { transform: translate3d(-3px, 0, 0); }
      20%, 80% { transform: translate3d(5px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-7px, 0, 0); }
      40%, 60% { transform: translate3d(7px, 0, 0); }
    }

    /* 魔法陣・火の粉エフェクト */
    .rising-item {
      position: fixed;
      bottom: -30px;
      z-index: 9999;
      pointer-events: none;
      user-select: none;
      opacity: 0;
      animation: magicRise ease-out forwards;
    }
    @keyframes magicRise {
      0% { transform: translateY(0) scale(0.4) rotate(0deg); opacity: 0; }
      15% { opacity: 0.95; }
      50% { transform: translateY(-50vh) translateX(var(--drift, 20px)) scale(1.1) rotate(180deg); opacity: 0.9; }
      85% { opacity: 0.7; }
      100% { transform: translateY(-110vh) translateX(calc(var(--drift, 20px) * -1)) scale(1.3) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

<div class="container" id="mainContainer">
  <div class="header">
    <div class="logo-area">
      <!-- 錬金術・魔法陣ロゴ -->
      <svg class="rune-logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <polygon points="50,5 93,25 93,75 50,95 7,75 7,25" fill="none" stroke="#f59e0b" stroke-width="4" />
        <circle cx="50" cy="50" r="32" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="6,4" />
        <!-- T字の魔導天秤 -->
        <line x1="28" y1="36" x2="72" y2="36" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />
        <line x1="50" y1="36" x2="50" y2="70" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" />
        <circle cx="30" cy="44" r="4" fill="#06b6d4" />
        <circle cx="70" cy="44" r="4" fill="#ef4444" />
      </svg>
      <div>
        <h1 class="logo-title">T勘定の迷宮</h1>
        <div style="font-size:0.7rem; color:var(--text-muted);">〜 決算整理と天秤の試練 〜</div>
      </div>
    </div>
    <span class="status-badge" id="status-tag">🛡️ 探索中</span>
  </div>

  <div class="dungeon-progress">
    <div style="display:flex; justify-content:space-between; font-size:0.75rem; font-weight:bold;">
      <span style="color:var(--gold-light);">🗝️ 迷宮の踏破深度</span>
      <span id="progress-text">第 1 階層</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progress-fill"></div>
    </div>
  </div>

  <!-- 試練エリア -->
  <div id="quiz-area">
    <div class="card">
      <div class="floor-badge" id="q-number">第 1 層 // 守護巨兵の回廊</div>
      <p class="story-text" id="story-display">石碑の文字を解読中...</p>
    </div>

    <div class="split-container">
      <div class="side-column">
        <div class="side-title">⚖️ 借方 (Debit) - 宿命の左秤</div>
        <div id="debit-rows"></div>
        <button type="button" class="btn-add" onclick="addRow('debit')">＋ 刻印を追加</button>
      </div>
      <div class="side-column credit">
        <div class="side-title">⚖️ 貸方 (Credit) - 誓約の右秤</div>
        <div id="credit-rows"></div>
        <button type="button" class="btn-add" onclick="addRow('credit')">＋ 刻印を追加</button>
      </div>
    </div>

    <button type="button" class="btn-submit" id="submit-btn" onclick="checkAnswer()">⚡ 詠唱：天秤の仕訳を刻む！</button>
    <div id="result-display" class="result-box"></div>

    <div class="nav-buttons">
      <button type="button" class="nav-btn" onclick="prevQuestion()">◀ 浅い階層へ</button>
      <button type="button" class="nav-btn" id="next-btn" onclick="nextQuestion()">深層へ進む ▶</button>
    </div>
  </div>

  <!-- 踏破画面 -->
  <div id="clear-area" class="clear-card">
    <h2>🏰 迷宮の最深部を完全踏破！</h2>
    <div id="complete-badge-area"></div>
    <p id="score-text" style="line-height:1.7; color:var(--text-muted);"></p>
    <div id="review-btn-area"></div>
    <button type="button" class="btn-restart" onclick="startFreshQuiz()">迷宮の入口から再挑戦する 🗝️</button>
  </div>

  <!-- 古文書JSON読み込み窓 -->
  <details>
    <summary>📜 古代石碑の写本を読み込む (外部JSON)</summary>
    <textarea id="json-input" placeholder="AIジェネレーターで作成した問題データ（[ ... ]）をここに貼り付けると、迷宮の構造を再構築できます"></textarea>
    <button type="button" class="load-btn" onclick="loadCustomData()">🔮 迷宮を再構築する</button>
  </details>

  <span class="reset-link" onclick="forceReset()">※ 封印が狂った時はここを押して迷宮を初期化</span>
</div>
  <script>
const defaultDungeonData = [
  {
    "story": "【第1階層：風化する古代ゴーレム】迷宮を守護する古代機甲兵（備品：取得原価 600,000G）が稼働から1年経過し風化した。耐用年数5年、残存価額ゼロの定額法で減価償却を行う。天秤の記帳法は『間接法』を用いよ。（減価償却費 120,000G / 減価償却累計額 120,000G）",
    "debit": [{ "account": "減価償却費", "amount": 120000 }],
    "credit": [{ "account": "減価償却累計額", "amount": 120000 }],
    "explanation": "間接法では、備品の本体価値を直接減らすのではなく、資産の控除科目である「減価償却累計額（Accumulated Depreciation）」を貸方に計上します。"
  },
  {
    "story": "【第2階層：結界維持の前払封印】当期の10月1日、向こう1年分の迷宮結界維持費（支払保険料）120,000Gを金貨で支払い全額費用処理していた。年1回の決算日（3月31日）を迎え、未経過期間（6か月分：60,000G）を次期へ繰り延べる。（前払保険料）（支払保険料）",
    "debit": [{ "account": "前払保険料", "amount": 60000 }],
    "credit": [{ "account": "支払保険料", "amount": 60000 }],
    "explanation": "当期の費用から未経過分を取り消すため貸方に「支払保険料」、将来役務を受ける権利として借方に資産の「前払保険料（Prepaid Insurance）」を計上します。"
  },
  {
    "story": "【第3階層：魔導炉の未払エネルギー】迷宮を照らす魔導炉の稼働費（支払水道光熱費）のうち、当期末にあたる3月分 15,000Gが未払いである。当期の費用として見越し計上せよ。（支払水道光熱費）（未払水道光熱費）",
    "debit": [{ "account": "支払水道光熱費", "amount": 15000 }],
    "credit": [{ "account": "未払水道光熱費", "amount": 15000 }],
    "explanation": "当期に消費したエネルギーを費用（借方）に算入し、後日支払う義務として貸方に負債の「未払水道光熱費（Accrued Expenses）」を計上します。"
  },
  {
    "story": "【第4階層：封印の保管庫と前受金貨】当期の2月1日、向こう6か月分の宝物保管料（受取手数料）60,000Gを金貨で受け取り全額収益処理していた。決算日（3月31日）を迎え、次期に属する4か月分（40,000G）を繰り延べる。（受取手数料）（前受手数料）",
    "debit": [{ "account": "受取手数料", "amount": 40000 }],
    "credit": [{ "account": "前受手数料", "amount": 40000 }],
    "explanation": "当期の収益から次期分を取り消すため借方に「受取手数料」、将来保管義務を果たす負債として貸方に「前受手数料（Unearned Revenue）」を計上します。"
  },
  {
    "story": "【第5階層：未収の古代利息】期中に冒険者ギルドへ貸し付けた遠征資金の利息（受取利息）のうち、当期に属する未収分 25,000Gを見越し計上せよ。（未収利息）（受取利息）",
    "debit": [{ "account": "未収利息", "amount": 25000 }],
    "credit": [{ "account": "受取利息", "amount": 25000 }],
    "explanation": "当期に発生した収益を貸方に計上し、後日利息を受け取る権利として借方に資産の「未収利息（Accrued Interest）」を計上します。"
  },
  {
    "story": "【第6階層：闇商人への売掛債権】期末の売掛金残高 800,000Gに対して、過去の不履行率に基づき 2% の貸倒れを見積もる。なお、決算整理前の貸倒引当金残高は 0Gである（差額補充法）。（貸倒引当金繰入）（貸倒引当金）",
    "debit": [{ "account": "貸倒引当金繰入", "amount": 16000 }],
    "credit": [{ "account": "貸倒引当金", "amount": 16000 }],
    "explanation": "800,000G × 2% = 16,000G。費用の「貸倒引当金繰入（Bad Debt Expense）」を借方に、資産の控除科目「貸倒引当金（Allowance for Doubtful Accounts）」を貸方に計上します。"
  },
  {
    "story": "【第7階層：補充の天秤】期末の売掛金残高 1,000,000Gに対して 3% の貸倒引当金を設定する。なお、決算整理前の貸倒引当金残高が 10,000G残っている（差額補充法）。（貸倒引当金繰入）（貸倒引当金）",
    "debit": [{ "account": "貸倒引当金繰入", "amount": 20000 }],
    "credit": [{ "account": "貸倒引当金", "amount": 20000 }],
    "explanation": "目標額（1,000,000 × 3% = 30,000G）と既存残高（10,000G）の差額である 20,000Gだけを補充計上します。"
  },
  {
    "story": "【第8階層：神殿探査船の減価】深層探索用フロート船（車両運搬具：取得原価 1,200,000G）について、耐用年数6年、残存価額ゼロの定額法・間接法で減価償却を行う。（減価償却費 200,000G / 減価償却累計額 200,000G）",
    "debit": [{ "account": "減価償却費", "amount": 200000 }],
    "credit": [{ "account": "減価償却累計額", "amount": 200000 }],
    "explanation": "1,200,000G ÷ 6年 = 200,000G。借方に費用の「減価償却費」、貸方に「減価償却累計額」を刻みます。"
  },
  {
    "story": "【第9階層：回収不能の債権処理】前期から繰り越されていた売掛金 50,000Gが、取引先商会の破産により回収不能となった。なお、貸倒引当金の残高は 60,000G残っている。（貸倒引当金）（売掛金）",
    "debit": [{ "account": "貸倒引当金", "amount": 50000 }],
    "credit": [{ "account": "売掛金", "amount": 50000 }],
    "explanation": "前期以前の売掛金が貸倒れた場合、引当金残高の範囲内であれば「貸倒引当金の取り崩し（借方）」で相殺し、売掛金を減少させます。"
  },
  {
    "story": "【最深部：迷宮主の再振替仕訳】前期末に繰り延べていた「前払家賃 30,000G」について、新期首を迎えたため再振替仕訳（洗替）を行う。（支払家賃）（前払家賃）",
    "debit": [{ "account": "支払家賃", "amount": 30000 }],
    "credit": [{ "account": "前払家賃", "amount": 30000 }],
    "explanation": "期首の再振替仕訳では、前期末の決算整理仕訳の逆仕訳を行います。借方に「支払家賃」を戻し、貸方に「前払家賃」を計上して当期の費用に算入します。"
  }
];
let baseQuestions = defaultDungeonData;
let currentQuestions = defaultDungeonData;
let currentIndex = 0;
let correctCount = 0;
let wrongList = [];
let answeredSet = new Set();
let isReviewMode = false;

function init() {
  try {
    const saved = localStorage.getItem("t_labyrinth_custom_data");
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length > 0) baseQuestions = parsed;
    }
  } catch (e) {
    baseQuestions = defaultDungeonData;
  }

  try {
    const savedIdx = localStorage.getItem("t_labyrinth_idx");
    const savedCorrect = localStorage.getItem("t_labyrinth_correct");
    const savedWrongs = localStorage.getItem("t_labyrinth_wrongs");
    const savedReview = localStorage.getItem("t_labyrinth_review");

    isReviewMode = (savedReview === "true");
    wrongList = savedWrongs ? JSON.parse(savedWrongs) : [];
    currentQuestions = isReviewMode ? [...wrongList] : [...baseQuestions];
    correctCount = savedCorrect ? parseInt(savedCorrect, 10) : 0;
    currentIndex = savedIdx ? parseInt(savedIdx, 10) : 0;
  } catch (e) {
    currentQuestions = [...baseQuestions];
    currentIndex = 0;
  }

  if (!currentQuestions || currentQuestions.length === 0 || currentIndex >= currentQuestions.length || currentIndex < 0) {
    currentIndex = 0;
    currentQuestions = [...baseQuestions];
    isReviewMode = false;
  }

  document.getElementById("quiz-area").style.display = "block";
  document.getElementById("clear-area").style.display = "none";
  loadQuestion(currentIndex);
}

function createRowHTML(account = "", amount = "") {
  const div = document.createElement("div");
  div.className = "entry-row";
  div.innerHTML = `
    <input type="text" placeholder="勘定科目" value="${account}">
    <input type="number" placeholder="金額(G)" value="${amount}">
    <button type="button" class="btn-remove" onclick="removeRow(this)">✕</button>
  `;
  return div;
}

function addRow(side) {
  const container = document.getElementById(`${side}-rows`);
  if (container) container.appendChild(createRowHTML());
}

function removeRow(btn) {
  const row = btn.closest(".entry-row");
  if (row && row.parentElement && row.parentElement.children.length > 1) {
    row.remove();
  } else {
    alert("天秤には最低1つの刻印が必要です。");
  }
}

function loadQuestion(index) {
  if (!currentQuestions || currentQuestions.length === 0) return;
  if (index < 0 || index >= currentQuestions.length) index = 0;
  currentIndex = index;

  try {
    localStorage.setItem("t_labyrinth_idx", currentIndex);
    localStorage.setItem("t_labyrinth_correct", correctCount);
    localStorage.setItem("t_labyrinth_wrongs", JSON.stringify(wrongList));
    localStorage.setItem("t_labyrinth_review", isReviewMode);
  } catch(e) {}

  const tag = document.getElementById("status-tag");
  if (isReviewMode) {
    tag.textContent = "🔄 再封印中";
    tag.className = "status-badge review";
  } else {
    tag.textContent = "🛡️ 探索中";
    tag.className = "status-badge";
  }

  const prefix = isReviewMode ? "🔄 再封印" : "🗝️ 迷宮試練";
  document.getElementById("q-number").textContent = `${prefix} // 第 ${index + 1} 層 (全 ${currentQuestions.length} 層)`;
  document.getElementById("story-display").textContent = currentQuestions[index].story;

  document.getElementById("debit-rows").innerHTML = "";
  document.getElementById("credit-rows").innerHTML = "";
  addRow("debit");
  addRow("credit");

  const res = document.getElementById("result-display");
  res.style.display = "none";
  res.className = "result-box";
  document.getElementById("submit-btn").style.display = "block";

  const nextBtn = document.getElementById("next-btn");
  nextBtn.textContent = (currentIndex === currentQuestions.length - 1) ? "最深部の封印を解く ⚡" : "深層へ進む ▶";

  const percent = Math.round(((index + 1) / currentQuestions.length) * 100);
  document.getElementById("progress-fill").style.width = percent + "%";
  document.getElementById("progress-text").textContent = `第 ${index + 1} / ${currentQuestions.length} 層 (${percent}%)`;
}

function getEntries(side) {
  const container = document.getElementById(`${side}-rows`);
  if (!container) return [];
  const rows = container.children;
  const entries = [];
  for (let row of rows) {
    const inputs = row.querySelectorAll("input");
    if (inputs.length >= 2) {
      const account = inputs[0].value.trim();
      const amount = parseInt(inputs[1].value, 10);
      if (account && !isNaN(amount)) entries.push({ account, amount });
    }
  }
  return entries;
}

/* ==================================================
   ★ ダンジョン演出：魔力火の粉・結晶の舞い上がり
================================================== */
function spawnMagicAura() {
  const runes = ["✨", "⚡", "💎", "🔮", "🔥", "🛡️", "📜", "⚖️"];
  const totalItems = 26;

  for (let i = 0; i < totalItems; i++) {
    const item = document.createElement("div");
    item.className = "rising-item";
    item.textContent = runes[Math.floor(Math.random() * runes.length)];
    item.style.left = (Math.random() * 92 + 4) + "vw";
    
    const driftX = (Math.random() * 90 - 45) + "px";
    item.style.setProperty("--drift", driftX);

    const size = Math.random() * 16 + 22;
    const duration = Math.random() * 1.5 + 2.0;
    const delay = Math.random() * 0.4;

    item.style.fontSize = size + "px";
    item.style.animationDuration = duration + "s";
    item.style.animationDelay = delay + "s";

    document.body.appendChild(item);

    setTimeout(() => {
      item.remove();
    }, (duration + delay) * 1000);
  }
}

/* ==================================================
   ★ トラップ発動：石壁のシェイク
================================================== */
function triggerTrapShake() {
  const container = document.getElementById("mainContainer");
  container.classList.remove("shake-animation");
  void container.offsetWidth;
  container.classList.add("shake-animation");

  setTimeout(() => {
    container.classList.remove("shake-animation");
  }, 500);
}

function checkAnswer() {
  const q = currentQuestions[currentIndex];
  const userDebit = getEntries("debit");
  const userCredit = getEntries("credit");

  const normalize = d => Array.isArray(d) ? d : [d];
  const cDebit = normalize(q.debit);
  const cCredit = normalize(q.credit);

  const matchSide = (u, c) => {
    if (u.length !== c.length) return false;
    const sU = [...u].sort((a,b) => a.account.localeCompare(b.account) || a.amount - b.amount);
    const sC = [...c].sort((a,b) => a.account.localeCompare(b.account) || a.amount - b.amount);
    return sU.every((v, i) => v.account === sC[i].account && v.amount === sC[i].amount);
  };

  const isOk = matchSide(userDebit, cDebit) && matchSide(userCredit, cCredit);
  const res = document.getElementById("result-display");
  res.style.display = "block";

  if (isOk) {
    spawnMagicAura();
    res.className = "result-box correct";
    res.innerHTML = `<strong>⚖️ 天秤の均衡が成立した！</strong><br>${q.explanation}`;
    if (!answeredSet.has(currentIndex)) {
      correctCount++;
      if (isReviewMode) wrongList = wrongList.filter(item => item.story !== q.story);
      answeredSet.add(currentIndex);
    }
  } else {
    triggerTrapShake();
    res.className = "result-box wrong";
    const dStr = cDebit.map(d => `(${d.account}: ${d.amount.toLocaleString()}G)`).join(" ");
    const cStr = cCredit.map(c => `(${c.account}: ${c.amount.toLocaleString()}G)`).join(" ");
    res.innerHTML = `<strong>⚠️ 天秤が傾き、罠が作動した！</strong><br>真の刻印 借方: ${dStr}<br>真の刻印 貸方: ${cStr}<br><br>${q.explanation}`;
    if (!answeredSet.has(currentIndex)) {
      if (!wrongList.some(item => item.story === q.story)) wrongList.push(q);
      answeredSet.add(currentIndex);
    }
  }

  try {
    localStorage.setItem("t_labyrinth_correct", correctCount);
    localStorage.setItem("t_labyrinth_wrongs", JSON.stringify(wrongList));
  } catch(e) {}
}

function prevQuestion() { if (currentIndex > 0) loadQuestion(currentIndex - 1); }
function nextQuestion() {
  if (currentIndex < currentQuestions.length - 1) loadQuestion(currentIndex + 1);
  else showClearScreen();
}

function showClearScreen() {
  document.getElementById("quiz-area").style.display = "none";
  const clearArea = document.getElementById("clear-area");
  clearArea.style.display = "block";

  const total = currentQuestions.length;
  const badgeArea = document.getElementById("complete-badge-area");
  const scoreText = document.getElementById("score-text");
  const revArea = document.getElementById("review-btn-area");

  badgeArea.innerHTML = "";
  revArea.innerHTML = "";

  if (wrongList.length === 0) {
    spawnMagicAura();
    badgeArea.innerHTML = `<div class="badge-complete">🏆 迷宮制覇：大賢者の称号授与</div>`;
    scoreText.innerHTML = `すべての天秤を完璧に調和させました！決算整理の奥義を極めし者よ、讃えよ！ (${total}/${total} 層 踏破)`;
  } else {
    scoreText.innerHTML = `${total}層中、<strong>${correctCount}層</strong>の均衡に成功しました。<br>まだ迷宮の歪み（未解決の試練）が <strong>${wrongList.length}箇所</strong> 残っています。`;
    const btn = document.createElement("button");
    btn.className = "btn-review";
    btn.textContent = `🔄 歪んだ階層のみを再探索する (${wrongList.length}層)`;
    btn.onclick = () => {
      isReviewMode = true;
      currentQuestions = [...wrongList];
      currentIndex = 0;
      correctCount = 0;
      answeredSet.clear();
      document.getElementById("quiz-area").style.display = "block";
      clearArea.style.display = "none";
      loadQuestion(0);
    };
    revArea.appendChild(btn);
  }
}

function startFreshQuiz() {
  forceReset();
}

function forceReset() {
  localStorage.removeItem("t_labyrinth_custom_data");
  localStorage.removeItem("t_labyrinth_idx");
  localStorage.removeItem("t_labyrinth_correct");
  localStorage.removeItem("t_labyrinth_wrongs");
  localStorage.removeItem("t_labyrinth_review");
  location.reload();
}

function loadCustomData() {
  const input = document.getElementById("json-input").value.trim();
  if (!input) {
    alert("古文書（JSONデータ）を貼り付けてください。");
    return;
  }
  try {
    const data = JSON.parse(input);
    if (!Array.isArray(data) || data.length === 0) throw new Error();

    baseQuestions = data;
    localStorage.setItem("t_labyrinth_custom_data", JSON.stringify(data));
    localStorage.removeItem("t_labyrinth_idx");
    localStorage.removeItem("t_labyrinth_correct");
    localStorage.removeItem("t_labyrinth_wrongs");
    localStorage.removeItem("t_labyrinth_review");

    currentQuestions = [...baseQuestions];
    currentIndex = 0;
    correctCount = 0;
    wrongList = [];
    isReviewMode = false;
    answeredSet.clear();

    document.getElementById("quiz-area").style.display = "block";
    document.getElementById("clear-area").style.display = "none";
    loadQuestion(0);
    alert(`迷宮の構造が書き換わりました（全${baseQuestions.length}層）！`);
  } catch (e) {
    alert("⚠️ 古文書の記述（JSON構文）に誤りがあります。正しくコピーできているか確認してください。");
  }
}

window.addEventListener("DOMContentLoaded", init);
</script>
